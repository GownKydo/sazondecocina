<footer class="site-footer">
    <div class="footer-container">
        <!-- Sección principal: Info de marca y navegación organizada por columnas -->
        <div class="footer-content">
            <div class="footer-brand">
                <a href="{{ .Site.BaseURL }}" class="footer-logo">
                    {{ .Site.Title }}
                </a>
                <p class="footer-tagline">Descripción corta o lema de la marca/sitio web.</p>
            </div>

            <div class="footer-nav-group">
                <nav class="footer-nav" aria-label="Navegación del pie de página">
                    <h2 class="footer-heading">Enlaces útiles</h2>
                    <ul class="footer-links">
                        <li><a href="{{ "/acerca/" | relLangURL }}">Acerca de</a></li>
                        <li><a href="{{ "/contacto/" | relLangURL }}">Contacto</a></li>
                        <li><a href="{{ "/privacidad/" | relLangURL }}">Política de Privacidad</a></li>
                    </ul>
                </nav>

                <!-- Redes sociales (opcional)
                <div class="footer-social">
                    <h2 class="footer-heading">Síguenos</h2>
                    <div class="social-links">
                        <a href="#" aria-label="Twitter/X">Twitter</a>
                        <a href="#" aria-label="LinkedIn">LinkedIn</a>
                        <a href="#" aria-label="GitHub">GitHub</a>
                    </div>
                </div>
                -->
            </div>
        </div>

        <!-- Sección inferior: Derechos de autor y créditos -->
        <div class="footer-bottom">
            <p class="copyright">&copy; {{ now.Format "2006" }} {{ .Site.Title }}. Todos los derechos reservados.</p>
        </div>
    </div>
</footer>

<!-- Procesamiento dinámico de JS en Hugo Pipes -->
{{ $js := resources.Get "js/app.js" | resources.Minify | resources.Fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
