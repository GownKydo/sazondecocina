<header class="main-header">
    <div class="logo">
        <a href="{{ .Site.Home.RelPermalink }}">🌮 Recetario Latino</a>
    </div>

    <nav class="main-nav">
        <ul>
            {{ $currentPage := . }}
            {{ range .Site.Menus.main }}
                {{ $active := or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }}
                <li>
                    <a 
                        href="{{ .URL | relLangURL }}" 
                        class="{{ if $active }}active{{ end }}"
                        {{ if $active }}aria-current="page"{{ end }}
                    >
                        {{ .Name }}
                    </a>
                </li>
            {{ end }}

            <li>
                <!-- Botón de Modo Oscuro/Claro integrado con app.js -->
                <button id="theme-toggle" class="theme-btn" type="button" aria-label="Cambiar tema">🌙</button>
            </li>
        </ul>
    </nav>
</header>
