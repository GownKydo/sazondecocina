{{ define "main" }}
<section class="taxonomy-header">
    <h1>{{ .Title }}</h1>
    <p>Explora nuestras recetas agrupadas por {{ .Title | lower }}.</p>
</section>

<section class="terms-grid">
    {{ range .Data.Terms.ByCount }}
        <a href="{{ .Page.RelPermalink }}" class="term-card">
            <span class="term-name">{{ .Page.Title }}</span>
            <span class="term-count">{{ .Count }} {{ if eq .Count 1 }}receta{{ else }}recetas{{ end }}</span>
        </a>
    {{ else }}
        <p>No se encontraron {{ .Title | lower }}.</p>
    {{ end }}
</section>
{{ end }}
